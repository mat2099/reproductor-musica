<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Reproductor de Música</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #121212; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .player-container { background-color: #1e1e1e; padding: 30px; border-radius: 15px; box-shadow: 0 10px 20px rgba(0,0,0,0.5); width: 350px; text-align: center; }
        h2 { margin-bottom: 5px; color: #1DB954; }
        #current-song { font-style: italic; color: #b3b3b3; margin-bottom: 20px; display: block; }
        audio { width: 100%; margin-bottom: 20px; }
        .playlist { max-height: 200px; overflow-y: auto; text-align: left; background: #282828; padding: 10px; border-radius: 8px; list-style: none; margin: 0; padding-left: 0; }
        .playlist li { padding: 10px; border-bottom: 1px solid #3e3e3e; cursor: pointer; transition: 0.2s; font-size: 14px; }
        .playlist li:hover { background-color: #3e3e3e; color: #1DB954; }
        .playlist li.active { background-color: #1DB954; color: black; font-weight: bold; }
    </style>
</head>
<body>

<div class="player-container">
    <h2>Mi Playlist</h2>
    <span id="current-song">Selecciona una canción</span>
    
    <!-- Elemento de audio nativo -->
    <audio id="audio-player" controls></audio>

    <!-- Lista de canciones en pantalla -->
    <ul class="playlist" id="playlist-container"></ul>
</div>

<script>
    // LISTA DE CANCIONES (Escribe el nombre EXACTO de tus archivos .mp3 de GitHub)
    const canciones = [
        "Bryan Adams - Heaven (Official Music Video).mp3",
        "Herencia De Grandes - Ya Borracho Official Video.mp3",
        "Bacilos - Caraluna (Official Music Video).mp3",
        "Labios Compartidos (2019 Remasterizado) [vPDn5xYxqIE].mp3",
        "Aventura - El Perdedor.mp3",
        "Andrés Cepeda - Desesperado (Official Video) [N5olyi6xywU].mp3",
        "Manuel Medrano - Bajo El Agua (Video Oficial).mp3",
        "Yandel - Encantadora (Official Video).mp3"
    ];

    const audioPlayer = document.getElementById('audio-player');
    const playlistContainer = document.getElementById('playlist-container');
    const currentSongTitle = document.getElementById('current-song');
    let trackActual = 0;

    // Generar la lista visual de canciones
    canciones.forEach((cancion, index) => {
        const li = document.createElement('li');
        // Quitamos el ".mp3" del texto para que se vea más limpio en pantalla
        li.textContent = cancion.replace('.mp3', ''); 
        li.onclick = () => cargarCancion(index);
        playlistContainer.appendChild(li);
    });

    // Función para cargar y reproducir una canción
    function cargarCancion(index) {
        trackActual = index;
        
        // El truco de la opción A: encodeURIComponent arregla los espacios y corchetes automáticamente
        audioPlayer.src = encodeURIComponent(canciones[index]);
        currentSongTitle.textContent = canciones[index].replace('.mp3', '');

        // Cambiar la canción activa visualmente
        const elementos = playlistContainer.getElementsByTagName('li');
        for (let i = 0; i < elementos.length; i++) {
            elementos[i].classList.remove('active');
        }
        elementos[index].classList.add('active');

        audioPlayer.play();
    }

    // Al terminar una canción, pasa automáticamente a la siguiente
    audioPlayer.onended = () => {
        let siguiente = trackActual + 1;
        if (siguiente < canciones.length) {
            cargarCancion(siguiente);
        } else {
            cargarCancion(0); // Vuelve a empezar si era la última
        }
    };
</script>

</body>
</html>
