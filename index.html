<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para U.M</title>
    <!-- Fuente elegante -->
    <link href="https://googleapis.com" rel="stylesheet">
    
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: linear-gradient(-45deg, #0b0711, #1a091c, #050508, #180a15);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: white; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            padding: 20px; 
            box-sizing: border-box; 
            position: relative;
            overflow: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .player-container { 
            background: rgba(20, 15, 25, 0.85);
            backdrop-filter: blur(12px);
            padding: 40px 30px; 
            border-radius: 30px; 
            border: 1px solid rgba(255, 117, 140, 0.2);
            box-shadow: 0 20px 40px rgba(0,0,0,0.8), 0 0 25px rgba(255, 117, 140, 0.15); 
            width: 440px; 
            text-align: center; 
            z-index: 10; 
        }

        .initials-title { 
            font-family: 'Playfair Display', serif;
            font-size: 42px;
            font-weight: 600;
            font-style: italic;
            margin-top: 0; 
            margin-bottom: 8px; 
            letter-spacing: 3px;
            background: linear-gradient(45deg, #ff758c, #ff7eb3, #fccb90);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 15px rgba(255, 117, 140, 0.3);
        }

        #current-song { 
            font-style: normal; 
            color: #d1b3ca; 
            margin-bottom: 20px; 
            height: 55px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 14px; 
            font-weight: 500;
            background: rgba(255,255,255,0.02);
            border-radius: 12px;
            padding: 0 15px;
            border-left: 4px solid #ff758c;
        }

        /* DISEÑO DE LAS ONDAS DE AUDIO */
        .wave-container {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            height: 40px;
            margin-bottom: 20px;
            gap: 4px;
        }

        .wave-bar {
            width: 4px;
            height: 8px;
            background: linear-gradient(to top, #ff758c, #ff7eb3);
            border-radius: 2px;
            transition: height 0.2s ease;
        }

        /* Animación activa cuando la música suena */
        .wave-container.playing .wave-bar {
            animation: bounce 1.2s ease-in-out infinite alternate;
        }

        /* Variamos los tiempos de cada barrita para que parezca una onda real */
        .wave-container.playing .wave-bar:nth-child(1) { animation-delay: 0.1s; }
        .wave-container.playing .wave-bar:nth-child(2) { animation-delay: 0.4s; }
        .wave-container.playing .wave-bar:nth-child(3) { animation-delay: 0.2s; }
        .wave-container.playing .wave-bar:nth-child(4) { animation-delay: 0.6s; }
        .wave-container.playing .wave-bar:nth-child(5) { animation-delay: 0.3s; }
        .wave-container.playing .wave-bar:nth-child(6) { animation-delay: 0.5s; }
        .wave-container.playing .wave-bar:nth-child(7) { animation-delay: 0.1s; }

        @keyframes bounce {
            0% { height: 8px; }
            100% { height: 38px; }
        }

        audio { 
            width: 100%; 
            margin-bottom: 25px; 
            filter: invert(90%) hue-rotate(290deg); 
        }

        .playlist { 
            max-height: 220px; 
            overflow-y: auto; 
            text-align: left; 
            background: rgba(10, 5, 15, 0.6); 
            padding: 5px; 
            border-radius: 14px; 
            list-style: none; 
            margin: 0; 
            border: 1px solid rgba(255,255,255,0.03);
        }

        .playlist::-webkit-scrollbar { width: 6px; }
        .playlist::-webkit-scrollbar-track { background: rgba(0,0,0,0.1); }
        .playlist::-webkit-scrollbar-thumb { background: rgba(255, 117, 140, 0.3); border-radius: 10px; }

        .playlist li { 
            padding: 14px 18px; 
            border-bottom: 1px solid rgba(255,255,255,0.02); 
            cursor: pointer; 
            transition: all 0.3s ease; 
            font-size: 13px; 
            color: #dfcbd7;
            white-space: nowrap; 
            overflow: hidden; 
            text-overflow: ellipsis; 
            border-radius: 10px;
            margin-bottom: 3px;
        }

        .playlist li:hover { 
            background-color: rgba(255, 117, 140, 0.1); 
            color: #ff758c; 
            padding-left: 23px; 
        }

        .playlist li.active { 
            background: linear-gradient(90deg, #ff758c, #ff7eb3); 
            color: #10050f; 
            font-weight: bold; 
            box-shadow: 0 4px 15px rgba(255, 117, 140, 0.4);
        }

        .dedication {
            font-family: 'Playfair Display', serif;
            font-size: 24px;
            font-style: italic;
            margin-top: 25px;
            margin-bottom: 0;
            background: linear-gradient(45deg, #ff758c, #fccb90);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 10px rgba(255, 117, 140, 0.2);
            letter-spacing: 1px;
        }

        .bg-heart {
            position: absolute;
            color: rgba(255, 117, 140, 0.08);
            font-size: 24px;
            animation: floatHearts 10s linear infinite;
            bottom: -50px;
        }

        @keyframes floatHearts {
            0% { transform: translateY(0) rotate(0deg); opacity: 0; }
            50% { opacity: 0.6; }
            100% { transform: translateY(-105vh) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>
