<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Reproductor Premium</title>
    <style>
        /* Fondo animado moderno */
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: linear-gradient(-45deg, #0f0c20, #150a21, #050508, #111a24);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: white; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            padding: 20px; 
            box-sizing: border-box; 
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Contenedor del reproductor con efecto Neón */
        .player-container { 
            background: rgba(25, 25, 35, 0.85);
            backdrop-filter: blur(10px);
            padding: 35px 30px; 
            border-radius: 24px; 
            border: 1px solid rgba(0, 242, 254, 0.2);
            box-shadow: 0 15px 35px rgba(0,0,0,0.7), 0 0 20px rgba(0, 242, 254, 0.1); 
            width: 440px; 
            text-align: center; 
        }

        h2 { 
            margin-top: 0; 
            margin-bottom: 5px; 
            font-size: 26px;
            letter-spacing: 1px;
            background: linear-gradient(45deg, #00f2fe, #4facfe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        #current-song { 
            font-style: normal; 
            color: #a0a0c0; 
            margin-bottom: 25px; 
            height: 55px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 14px; 
            font-weight: 500;
            background: rgba(255,255,255,0.03);
            border-radius: 10px;
            padding: 0 15px;
            border-left: 4px solid #00f2fe;
        }

        /* Cambiar estética del reproductor nativo */
        audio { 
            width: 100%; 
            margin-bottom: 25px; 
            filter: invert(90%) hue-rotate(180deg); /* Truco para volverlo oscuro y azul */
        }

        /* Lista de reproducción estilizada */
        .playlist { 
            max-height: 280px; 
            overflow-y: auto; 
            text-align: left; 
            background: rgba(10, 10, 15, 0.6); 
            padding: 5px; 
            border-radius: 12px; 
            list-style: none; 
            margin: 0; 
            border: 1px solid rgba(255,255,255,0.05);
        }

        /* Personalizar la barra de desplazamiento (Scrollbar) */
        .playlist::-webkit-scrollbar { width: 6px; }
        .playlist::-webkit-scrollbar-track { background: rgba(0,0,0,0.1); }
        .playlist::-webkit-scrollbar-thumb { background: rgba(0, 242, 254, 0.3); border-radius: 10px; }

        /* Elementos de la lista */
        .playlist li { 
            padding: 14px 18px; 
            border-bottom: 1px solid rgba(255,255,255,0.03); 
            cursor: pointer; 
            transition: all 0.3s ease; 
            font-size: 13px; 
            color: #cbcbdf;
            white-space: nowrap; 
            overflow: hidden; 
            text-overflow: ellipsis; 
            border-radius: 8px;
            margin-bottom: 2px;
        }

        .playlist li:hover { 
            background-color: rgba(0, 242, 254, 0.1); 
            color: #00f2fe; 
            padding-left: 23px; /* Efecto de desplazamiento al pasar el mouse */
        }

        /* Canción sonando actualmente */
        .playlist li.active { 
            background: linear-gradient(90deg, #00f2fe, #4facfe); 
            color: #050508; 
            font-weight: bold; 
            box-shadow: 0 4px 12px rgba(0, 242, 254, 0.3);
        }
    </style>
</head>
<body>

<div class="player-container">
    <h2>Mi Playlist</h2>
    <span id="current-song">Selecciona una canción para reproducir</span>
    
    <audio id="audio-player" controls></audio>

    <ul class="playlist" id="playlist-container"></ul>
</div>

<script>
    // LISTA DE CANCIONES (Tus nombres exactos de archivo de GitHub)
    const canciones = [
        "HUMBE - KINTSUGI.mp3",
        "Herencia De Grandes - Ya Borracho Official Video.mp3",
        "Ken Carson - Swag Overload (Official Audio) [2S9SdfmZp6I].mp3",
        "Labios Compartidos (2019 Remasterizado) [vPDn5xYxqIE].mp3",
        "Lil Peep - Star Shopping (Official Audio).mp3",
        "Maluma - ADMV (Official Video).mp3",
        "Manuel Medrano - Bajo El Agua (Video Oficial).mp3",
        "Marshmello x Lil Peep - Spotlight [Official Audio].mp3",
        "Myke Towers - EXTASY (Video Oficial).mp3",
        "OMAR COURTZ (((ousi))) - POR SI MAÑANA NO ESTOY (Official Video).mp3",
        "OMAR COURTZ (((ousi))), Myke Towers - WHAT U NEED (Official Video).mp3",
        "OMAR COURTZ (((ousi))), ROA - WO OH OH (Official Video).mp3",
        "Andrés Cepeda - Desesperado (Official Video) [N5olyi6xywU].mp3",
        "Avenoir - Shameless.mp3",
        "Aventura - El Perdedor.mp3",
        "Bacilos - Caraluna (Official Music Video).mp3",
        "Bad Bunny - WHERE SHE GOES (Video Oficial) [1f0xYhR9L-E].mp3",
        "Bryan Adams - Heaven (Official Music Video).mp3",
        "Calvin Harris - Summer (Official Video).mp3",
        "Charlie Puth - Attention Official Video.mp3",
        "Chase Atlantic - Into It (Official Audio).mp3",
        "Duke Dumont - Ocean Drive.mp3",
        "Feid - que putas (Audio) [YQ0B5lpH9KE].mp3",
        "Goo Goo Dolls - Iris Official Music Video 4K Remix.mp3",
        "Sonder - Too Fast (Official Music Video).mp3",
        "TMW [opcZUmT4zXM] (1).mp3",
        "The Weeknd - Can t Feel My Face (Official Video).mp3",
        "The Weeknd - Wicked Games (Official Video - Explicit).mp3",
        "Yandel - Encantadora (Official Video).mp3",
        "Yandel - Explícale (Official Video) ft. Bad Bunny.mp3"
    ];

    const audioPlayer = document.getElementById('audio-player');
    const playlistContainer = document.getElementById('playlist-container');
    const currentSongTitle = document.getElementById('current-song');
    let trackActual = 0;

    canciones.forEach((cancion, index) => {
        const li = document.createElement('li');
        // Limpiamos los textos largos quitando formatos para que luzca estético
        let nombreLimpio = cancion.replace('.mp3', '');
        li.textContent = nombreLimpio; 
        li.onclick = () => cargarCancion(index);
        playlistContainer.appendChild(li);
    });

    function cargarCancion(index) {
        trackActual = index;
        audioPlayer.src = encodeURIComponent(canciones[index]);
        currentSongTitle.textContent = canciones[index].replace('.mp3', '');

        const elementos = playlistContainer.getElementsByTagName('li');
        for (let i = 0; i < elementos.length; i++) {
            elementos[i].classList.remove('active');
        }
        elementos[index].classList.add('active');

        audioPlayer.play();
    }

    audioPlayer.onended = () => {
        let siguiente = trackActual + 1;
        if (siguiente < canciones.length) {
            cargarCancion(siguiente);
        } else {
            cargarCancion(0);
        }
    };
</script>

</body>
</html>
